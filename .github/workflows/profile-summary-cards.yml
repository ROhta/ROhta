name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_SUMMARY_CARDS }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 9
      # trophy は外部ホスティング (vercel/deno.dev) が頻繁に死ぬので、リポジトリ内で生成してコミットする
      # 上流の action.yml は存在しない denoland/setup-deno@v1 を参照していて startup_failure になるため、同じ処理を直接書く
      - uses: actions/checkout@v7
        with:
          repository: ryo-ma/github-profile-trophy
          path: .trophy
      - uses: denoland/setup-deno@v2
      - env:
          GITHUB_TOKEN1: ${{ secrets.PROFILE_SUMMARY_CARDS }}
        run: deno run --allow-net --allow-env --allow-read --allow-write .trophy/render_svg.ts "$GITHUB_REPOSITORY_OWNER" profile-summary-card-output/tokyonight/5-trophy.svg tokyonight
      - run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add profile-summary-card-output/tokyonight/5-trophy.svg
          git diff --cached --quiet || git commit -m "Generate trophy"
          git push
